<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南大隅高校文化祭2026</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="jal-shell">
        <div id="ad-overlay" class="ad-overlay" aria-hidden="true">
            <img src="img/広告画像１.png" alt="Festival advertisement" class="ad-image">
        </div>
        <header class="jal-header">
            <div class="jal-brand">
                <div class="jal-logo">
                    <img src="img/高校ロゴ.gif" alt="Festival logo" class="jal-logo-img" />
                </div>
                <div class="jal-title">南大隅高校文化祭2026</div>
            </div>
            <div class="jal-meta">
                <div class="flight-detail">
                    <span class="flight-code">FES2026</span>
                    <span class="route-text">南大隅高校文化祭</span>
                </div>
                <div class="time-widget">
                    <span class="time-label">CURRENT TIME</span>
                    <span id="clock">11:59:59</span>
                </div>
            </div>
        </header>

        <main class="jal-main">
            <section class="jal-map-panel">
                <div class="map-card">
                    <div class="photo-rotator">
                        <img id="photo-current" src="img/画像１.jpg" alt="Festival photo 1" class="photo-current">
                        <div id="photo-caption" class="photo-caption">写真 1 / 4</div>
                    </div>
                </div>
            </section>

            <section class="jal-info-panel">
                <div class="thank-you-panel">
                    <div id="thank-you-copy" class="thank-you-copy">
                        <h2 id="thank-you-message">ご来場ありがとうございます</h2>
                        <p id="schedule-label" class="schedule-label">予定時刻</p>
                        <p id="schedule-title" class="schedule-title">開会式 09:00</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
