<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南大隅高校文化祭2026</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="jal-shell">
        <header class="jal-header">
            <div class="jal-brand">
                <div class="jal-logo">
                    <img src="img/logo.gif" alt="Festival logo" class="jal-logo-img" />
                </div>
                <div class="jal-title">南大隅高校文化祭2026</div>
            </div>
            <div class="jal-meta">
                <div class="flight-detail">
                    <span class="flight-code">FES2026</span>
                    <span class="route-text">南大隅高校文化祭</span>
                </div>
                <div class="time-widget">
                    <span class="time-label">CURRENT TIME</span>
                    <span id="clock">11:59:59</span>
                </div>
            </div>
        </header>

        <main class="jal-main">
            <section class="jal-map-panel">
                <div class="map-card">
                    <div class="photo-rotator">
                        <img id="photo-current" src="img/117058.jpg" alt="Festival photo 1" class="photo-current">
                        <div id="photo-caption" class="photo-caption">写真 1 / 3</div>
                    </div>
                </div>
            </section>

            <section class="jal-info-panel">
                <div class="thank-you-panel">
                    <h2 id="thank-you-message" data-lang-ja="ご来場ありがとう&#10;ございます" data-lang-en="Thank you for coming&#10;to our festival" data-lang-ko="문화제에 와 주셔서&#10;감사합니다" data-lang-th="ขอบคุณที่มา&#10;ร่วมงานเทศกาลของเรา">ご来場ありがとうございます</h2>
                </div>
            </section>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
